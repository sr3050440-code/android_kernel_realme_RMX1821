name: RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Q branch
        uses: actions/checkout@v4
        with:
          ref: Q
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            libelf-dev \
            libgnutls28-dev \
            clang \
            lld \
            llvm \
            git \
            zip \
            unzip \
            cpio \
            rsync \
            python2.7 \
            python2.7-minimal

          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2

          echo "===== HOST TOOLS ====="
          gcc --version | head -n 1
          clang --version | head -n 1
          ld --version | head -n 1
          ld.lld --version | head -n 1
          python2.7 --version

      # ============================================================
      # SOURCE CHECK
      # ============================================================
      - name: Check kernel source
        shell: bash
        run: |
          set -euxo pipefail

          test -f Makefile
          test -f arch/arm64/configs/RMX1821_defconfig
          test -f tools/dct/DrvGen.py

          echo
          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile

          echo
          echo "========================================"
          echo "DEVICE DEFCONFIG"
          echo "========================================"

          grep -E \
            '^(CONFIG_(CROSS_COMPILE|CROSS_COMPILE_ARM32|LOCALVERSION|MACH_MT6771|BUILD_ARM64_APPENDED_DTB_IMAGE|IMG_GZ_DTB))=' \
            arch/arm64/configs/RMX1821_defconfig || true

      # ============================================================
      # DISABLE ONLY PHOENIX
      #
      # IMPORTANT:
      # We do NOT disable all VENDOR_EDIT.
      # We do NOT create fake phoenix.h.
      #
      # Phoenix is optional in this source, but the source's
      # panic.c/init/main.c reference its missing header while
      # VENDOR_EDIT is globally enabled.
      # ============================================================
      - name: Disable missing Phoenix dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("kernel/panic.c"),
              Path("init/main.c"),
          ]

          for path in files:
              text = path.read_text(encoding="utf-8")

              original = text

              # ----------------------------------------------------
              # Remove only VENDOR_EDIT blocks that belong to
              # Phoenix. Other VENDOR_EDIT blocks remain untouched.
              # ----------------------------------------------------
              lines = text.splitlines(True)

              out = []
              i = 0

              while i < len(lines):
                  line = lines[i]

                  if "#ifdef VENDOR_EDIT" in line:
                      block = [line]
                      depth = 1
                      j = i + 1

                      while j < len(lines):
                          x = lines[j]

                          if "#ifdef" in x or "#if " in x or "#if(" in x:
                              depth += 1

                          if "#endif" in x:
                              depth -= 1

                          block.append(x)

                          if depth == 0:
                              break

                          j += 1

                      block_text = "".join(block)

                      phoenix_markers = [
                          "PHOENIX_PROJECT",
                          "project phoenix",
                          "phoenix project",
                          "phx_",
                          "oppo_phoenix",
                      ]

                      if any(
                          marker.lower() in block_text.lower()
                          for marker in phoenix_markers
                      ):
                          print(
                              f"Removing Phoenix block from {path} "
                              f"lines {i+1}-{j+1}"
                          )

                          i = j + 1
                          continue

                  out.append(line)
                  i += 1

              text = "".join(out)

              # ----------------------------------------------------
              # Extra safety: remove a standalone Phoenix include
              # if one remains.
              # ----------------------------------------------------
              filtered = []

              for line in text.splitlines(True):
                  if "oppo_phoenix/oppo_phoenix.h" in line:
                      print(
                          f"Removing Phoenix header include from {path}"
                      )
                      continue

                  filtered.append(line)

              text = "".join(filtered)

              if text == original:
                  print(f"WARNING: no Phoenix change detected in {path}")

              path.write_text(text, encoding="utf-8")

          PY

          # --------------------------------------------------------
          # Disable Phoenix Kconfig option in generated configuration
          # --------------------------------------------------------
          cat > phoenix-disable.fragment <<'EOF'
          # CONFIG_OPPO_PHOENIX is not set
          EOF

          echo
          echo "========================================"
          echo "VERIFY PHOENIX REFERENCES"
          echo "========================================"

          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.github \
            'oppo_phoenix\.h\|phx_' \
            kernel init drivers/soc/oppo/oppo_phoenix \
            || true

          echo
          echo "Phoenix source files remain in tree, but the feature"
          echo "will be disabled in the final kernel configuration."

      # ============================================================
      # PREPARE SCRIPTS
      # ============================================================
      - name: Prepare source scripts
        shell: bash
        run: |
          set -euxo pipefail

          git config --global core.autocrlf false

          sed -i 's/\r$//' tools/dct/DrvGen.py

          chmod +x tools/dct/DrvGen.py

          python2.7 -m py_compile \
            tools/dct/DrvGen.py

      # ============================================================
      # ANDROID GCC 4.9
      # ============================================================
      - name: Download Android 10 GCC 4.9 toolchains
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf toolchains

          mkdir -p \
            toolchains/gcc64 \
            toolchains/gcc32

          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64

          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchains/gcc32

          test -x \
            toolchains/gcc64/bin/aarch64-linux-android-gcc

          test -x \
            toolchains/gcc64/bin/aarch64-linux-android-ld

          test -x \
            toolchains/gcc32/bin/arm-linux-androideabi-gcc

          test -x \
            toolchains/gcc32/bin/arm-linux-androideabi-ld

      # ============================================================
      # COMPILER TEST
      # ============================================================
      - name: Verify compilers
        shell: bash
        run: |
          set -euxo pipefail

          GCC64="$GITHUB_WORKSPACE/toolchains/gcc64/bin"
          GCC32="$GITHUB_WORKSPACE/toolchains/gcc32/bin"

          echo "===== HOST ====="

          command -v gcc
          command -v clang
          command -v clang++
          command -v ld
          command -v ld.lld

          echo
          echo "===== AARCH64 GCC ====="

          "$GCC64/aarch64-linux-android-gcc" \
            --version | head -n 2

          echo
          echo "===== ARM32 GCC ====="

          "$GCC32/arm-linux-androideabi-gcc" \
            --version | head -n 2

          echo
          echo "===== TARGET LINKERS ====="

          "$GCC64/aarch64-linux-android-ld" \
            --version | head -n 2

          "$GCC32/arm-linux-androideabi-ld" \
            --version | head -n 2

          echo
          echo "Compiler test: PASS"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PYTHON=python2.7

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          # Native host tools.
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTLD=ld.lld
          export HOSTAR=llvm-ar

          rm -rf out

          echo
          echo "========================================"
          echo "DEFCONFIG"
          echo "========================================"

          make O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            RMX1821_defconfig

          echo
          echo "========================================"
          echo "DISABLE PHOENIX IN CONFIG"
          echo "========================================"

          scripts/kconfig/merge_config.sh \
            -m \
            out/.config \
            phoenix-disable.fragment

          make O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            olddefconfig

          test -f out/.config

          echo
          echo "========================================"
          echo "VERIFY FINAL CONFIG"
          echo "========================================"

          grep '^# CONFIG_OPPO_PHOENIX is not set' \
            out/.config

          grep -E \
            '^(CONFIG_CROSS_COMPILE|CONFIG_CROSS_COMPILE_ARM32|CONFIG_MACH_MT6771|CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|CONFIG_IMG_GZ_DTB)=' \
            out/.config || true

      # ============================================================
      # BUILD
      # ============================================================
      - name: Compile kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PYTHON=python2.7

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTLD=ld.lld
          export HOSTAR=llvm-ar

          echo
          echo "========================================"
          echo "BUILD"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTLD=$HOSTLD"

          make -j"$(nproc)" \
            O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            PYTHON="$PYTHON" \
            2>&1 | tee build.log

      # ============================================================
      # VERIFY IMAGE
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "========================================"
          echo "KERNEL OUTPUT"
          echo "========================================"

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( \
              -name 'Image*' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
            \) \
            -printf '%p\n' | sort

          test -s \
            out/arch/arm64/boot/Image

          if [ -s \
            out/arch/arm64/boot/Image.gz-dtb ]; then

            echo "FOUND: Image.gz-dtb"

          elif [ -s \
            out/arch/arm64/boot/Image.gz ]; then

            echo "FOUND: Image.gz"

          else

            echo "ERROR: Image.gz-dtb/Image.gz not found"
            exit 1

          fi

          DTB_COUNT="$(
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtb' | wc -l
          )"

          echo "DTB COUNT: $DTB_COUNT"

          test "$DTB_COUNT" -gt 0

      # ============================================================
      # COLLECT
      # ============================================================
      - name: Collect kernel output
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kernel-output

          mkdir -p kernel-output/dtb

          for f in \
            Image \
            Image.gz \
            Image.gz-dtb \
            Image-dtb \
            Image.lz4 \
            Image.lzma \
            Image.xz
          do
            if [ -f \
              "out/arch/arm64/boot/$f" ]; then

              cp \
                "out/arch/arm64/boot/$f" \
                kernel-output/

            fi
          done

          find \
            out/arch/arm64/boot/dts \
            -type f \
            -name '*.dtb' \
            -exec cp {} kernel-output/dtb/ \;

          cp \
            out/.config \
            kernel-output/kernel.config

          cp \
            build.log \
            kernel-output/build.log

          echo
          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"

          find kernel-output \
            -type f \
            -printf '%p\n' | sort

      # ============================================================
      # PACKAGE
      # ============================================================
      - name: Package kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd kernel-output

          zip -9 -r \
            ../Realme3i-RMX1827-Kernel-Q.zip \
            .

          cd ..

          ls -lh \
            Realme3i-RMX1827-Kernel-Q.zip

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-RMX1827-Kernel-Q
          path: |
            Realme3i-RMX1827-Kernel-Q.zip
            kernel-output/build.log
            kernel-output/kernel.config
