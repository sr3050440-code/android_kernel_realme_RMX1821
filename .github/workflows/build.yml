name: Build Realme 3i Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies & Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncurses-dev zip libgnutls28-dev python3 python-is-python3 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi g++-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Download GCC Toolchains (4.9)
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Ensure Kernel Sublevel 186
        run: |
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 186/' Makefile

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:/usr/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Apply defconfig
          make O=out RMX1821_defconfig

          # Disable stack protector to prevent build failure
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config 2>/dev/null || true
          
          # Build
          make -j$(nproc --all) O=out KCFLAGS="-Wno-error -w -fno-stack-protector -fcommon"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-Kernel-4.14.186
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/mediatek/*.dtb
