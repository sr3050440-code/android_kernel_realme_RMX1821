name: Build Realme 3i RMX1827 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: RMX1827 Kernel Build
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: RMX1821_defconfig

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Q Branch
        uses: actions/checkout@v4
        with:
          ref: Q
          fetch-depth: 1

      # ============================================================
      # 2. SOURCE VALIDATION
      # ============================================================
      - name: Validate Kernel Source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " REALME 3 / 3i KERNEL SOURCE VALIDATION"
          echo "=========================================="

          test -f Makefile
          test -d arch/arm64
          test -f arch/arm64/configs/${DEFCONFIG}

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Defconfig:"
          echo "arch/arm64/configs/${DEFCONFIG}"

          echo
          echo "MT6771 DTS files:"
          find arch/arm64/boot/dts/mediatek \
            -type f \
            \( -name '*6771*.dts' -o -name '*6771*.dtsi' \) \
            | sort | head -100

          echo
          echo "RMX1827 references:"
          grep -RIn \
            --exclude-dir=.git \
            'RMX1827' \
            arch/arm64/boot/dts \
            arch/arm64/configs \
            2>/dev/null | head -50 || true

      # ============================================================
      # 3. PHOENIX CHECK
      #
      # DO NOT CREATE A FAKE oppo_phoenix.h.
      # If source really requires it, stop and show the exact
      # references instead of producing a misleading kernel.
      # ============================================================
      - name: Check Phoenix Dependency
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " PHOENIX DEPENDENCY CHECK"
          echo "=========================================="

          REFS="$(grep -RIn \
            --exclude-dir=.git \
            -E 'oppo_phoenix|oppo_phoenix\.h|vendor/oppo/oppo_phoenix' \
            . 2>/dev/null || true)"

          if [ -n "$REFS" ]; then
            echo "Phoenix references found:"
            echo
            echo "$REFS"
            echo

            HEADER_FOUND=0

            while IFS= read -r -d '' HEADER; do
              echo "Phoenix header found: $HEADER"
              HEADER_FOUND=1
            done < <(
              find . \
                -path './.git' -prune -o \
                -type f \
                -name 'oppo_phoenix.h' \
                -print0
            )

            if [ "$HEADER_FOUND" -eq 0 ]; then
              echo
              echo "ERROR: Source references oppo_phoenix.h"
              echo "but the real header is not present."
              echo
              echo "No fake header will be generated."
              exit 1
            fi

            echo
            echo "Phoenix dependency appears present."
          else
            echo "No Phoenix dependency referenced."
          fi

      # ============================================================
      # 4. PACKAGES
      # ============================================================
      - name: Install Build Dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            device-tree-compiler \
            flex \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      # ============================================================
      # 5. DOWNLOAD ANDROID GCC 4.9
      # ============================================================
      - name: Download Android GCC 4.9
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          cd "$GITHUB_WORKSPACE/toolchains"

          wget -q --show-progress \
            'https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android10-release.tar.gz' \
            -O gcc64.tar.gz

          mkdir gcc64
          tar -xzf gcc64.tar.gz -C gcc64

          wget -q --show-progress \
            'https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/android10-release.tar.gz' \
            -O gcc32.tar.gz

          mkdir gcc32
          tar -xzf gcc32.tar.gz -C gcc32

          echo
          echo "AArch64 GCC:"
          toolchains/gcc64/bin/aarch64-linux-android-gcc --version | head -1

          echo
          echo "ARM32 GCC:"
          toolchains/gcc32/bin/arm-linux-androideabi-gcc --version | head -1

      # ============================================================
      # 6. PREPARE SOURCE
      # ============================================================
      - name: Prepare Source
        shell: bash
        run: |
          set -e

          git config --global core.autocrlf false

          # Only clean the known Python 2 generator if present.
          if [ -f tools/dct/DrvGen.py ]; then
            sed -i 's/\r$//' tools/dct/DrvGen.py
            chmod +x tools/dct/DrvGen.py
          fi

          echo "Source preparation complete."

      # ============================================================
      # 7. CREATE CONFIG
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          rm -rf out
          mkdir -p out

          echo "=========================================="
          echo " CONFIGURING KERNEL"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "$DEFCONFIG"

          test -f out/.config

          echo
          echo "Running olddefconfig..."

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          echo
          echo "Config created successfully."

      # ============================================================
      # 8. CONFIG VALIDATION
      # ============================================================
      - name: Validate Config
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " CONFIG VALIDATION"
          echo "=========================================="

          test -f out/.config

          echo
          echo "Architecture:"
          grep '^CONFIG_ARM64=' out/.config || true

          echo
          echo "MTK / MT6771 options:"
          grep -E \
            'CONFIG_MTK|CONFIG_MEDIATEK|CONFIG_MACH_MT6771' \
            out/.config | head -100 || true

          echo
          echo "DTB options:"
          grep -E \
            'CONFIG_BUILD_ARM64|CONFIG_ARM64_APPENDED' \
            out/.config || true

          echo
          echo "Config validation complete."

      # ============================================================
      # 9. BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          export PATH="$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "=========================================="
          echo " BUILDING KERNEL"
          echo "=========================================="

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Compiler:"
          aarch64-linux-android-gcc --version | head -1

          echo
          echo "Build started:"
          date

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            2>&1 | tee build.log

          echo
          echo "Build finished:"
          date

      # ============================================================
      # 10. BUILD DTBS
      # ============================================================
      - name: Build DTBs
        shell: bash
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            dtbs

      # ============================================================
      # 11. VERIFY IMAGE
      # ============================================================
      - name: Verify Kernel Image
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " KERNEL OUTPUT"
          echo "=========================================="

          BOOT="out/arch/arm64/boot"

          test -d "$BOOT"

          echo
          echo "Boot directory:"
          find "$BOOT" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Kernel images:"

          FOUND=0

          for IMAGE in \
            Image \
            Image.gz \
            Image.gz-dtb \
            Image-dtb
          do
            if [ -f "$BOOT/$IMAGE" ]; then
              echo "FOUND: $BOOT/$IMAGE"
              ls -lh "$BOOT/$IMAGE"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo
            echo "ERROR: No kernel image was produced."
            exit 1
          fi

      # ============================================================
      # 12. VERIFY MT6771 DTBS
      # ============================================================
      - name: Verify MT6771 DTBs
        shell: bash
        run: |
          set -e

          DTB_DIR="out/arch/arm64/boot/dts/mediatek"

          if [ ! -d "$DTB_DIR" ]; then
            echo "ERROR: DTB directory does not exist."
            exit 1
          fi

          echo "=========================================="
          echo " MT6771 DTB OUTPUT"
          echo "=========================================="

          find "$DTB_DIR" \
            -type f \
            -name '*.dtb' \
            -printf '%f\n' \
            | sort

          COUNT="$(find "$DTB_DIR" -type f -name '*.dtb' | wc -l)"

          echo
          echo "DTB count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No DTBs were produced."
            exit 1
          fi

      # ============================================================
      # 13. COLLECT ARTIFACTS
      # ============================================================
      - name: Collect Kernel
        shell: bash
        run: |
          set -e

          rm -rf kernel-output
          mkdir -p kernel-output/dtb

          BOOT="out/arch/arm64/boot"

          for IMAGE in \
            Image \
            Image.gz \
            Image.gz-dtb \
            Image-dtb
          do
            if [ -f "$BOOT/$IMAGE" ]; then
              cp "$BOOT/$IMAGE" kernel-output/
            fi
          done

          if [ -d "$BOOT/dts/mediatek" ]; then
            find "$BOOT/dts/mediatek" \
              -type f \
              -name '*.dtb' \
              -exec cp {} kernel-output/dtb/ \;
          fi

          cp out/.config kernel-output/kernel.config
          cp build.log kernel-output/build.log

          echo
          echo "Collected files:"
          find kernel-output \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # 14. ZIP
      # ============================================================
      - name: Create Release Package
        shell: bash
        run: |
          set -e

          cd kernel-output

          zip -9 -r \
            ../Realme3i-RMX1827-kernel.zip \
            .

          cd ..

          ls -lh Realme3i-RMX1827-kernel.zip

      # ============================================================
      # 15. UPLOAD
      # ============================================================
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-RMX1827-kernel
          path: |
            Realme3i-RMX1827-kernel.zip
            kernel-output/build.log
            kernel-output/kernel.config
          if-no-files-found: error
