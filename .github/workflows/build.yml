name: RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Q branch
        uses: actions/checkout@v4
        with:
          ref: Q
          fetch-depth: 1

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            libssl-dev libncurses5-dev libncurses-dev \
            libelf-dev libgnutls28-dev \
            clang lld llvm \
            git zip unzip cpio rsync \
            python2.7 python2.7-minimal

          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2
          python2.7 --version
          clang --version
          ld.lld --version

      - name: Check kernel source
        run: |
          set -eux
          test -f Makefile
          test -f arch/arm64/configs/RMX1821_defconfig
          test -f tools/dct/DrvGen.py

          echo "===== KERNEL VERSION IN Makefile ====="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile

          echo "===== IMPORTANT DEFCONFIG ====="
          grep -E '^(CONFIG_(CROSS_COMPILE|CROSS_COMPILE_ARM32|LOCALVERSION|MACH_MT6771|CMDLINE|BUILD_ARM64_APPENDED_DTB_IMAGE|IMG_GZ_DTB))' \
            arch/arm64/configs/RMX1821_defconfig || true

      - name: Check Phoenix dependency
        shell: bash
        run: |
          set -euo pipefail

          refs="$(grep -RIl --exclude-dir=.git \
            --exclude='*.o' --exclude='*.a' --exclude='*.so' \
            'oppo_phoenix\.h' . || true)"

          if [ -n "$refs" ]; then
            echo "Phoenix header is referenced by:"
            printf '%s\n' "$refs"

            if [ ! -f vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/oppo_phoenix.h ]; then
              echo
              echo "ERROR: source references oppo_phoenix.h but the real Phoenix dependency is missing."
              echo "I will NOT create a fake/empty header."
              exit 1
            fi
          else
            echo "No oppo_phoenix.h reference found."
          fi

      - name: Prepare source scripts
        run: |
          set -eux
          git config --global core.autocrlf false
          sed -i 's/\r$//' tools/dct/DrvGen.py
          chmod +x tools/dct/DrvGen.py
          python2.7 -m py_compile tools/dct/DrvGen.py

      - name: Download Android 10 GCC 4.9 toolchains
        run: |
          set -eux
          rm -rf toolchains
          mkdir -p toolchains/gcc64 toolchains/gcc32

          git clone --depth=1 --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64

          git clone --depth=1 --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchains/gcc32

          test -x toolchains/gcc64/bin/aarch64-linux-android-gcc
          test -x toolchains/gcc64/bin/aarch64-linux-android-ld
          test -x toolchains/gcc32/bin/arm-linux-androideabi-gcc
          test -x toolchains/gcc32/bin/arm-linux-androideabi-ld

      - name: Verify host and target compilers
        shell: bash
        run: |
          set -euxo pipefail

          export GCC64="$GITHUB_WORKSPACE/toolchains/gcc64/bin"
          export GCC32="$GITHUB_WORKSPACE/toolchains/gcc32/bin"

          echo "===== HOST TOOLS ====="
          command -v clang
          command -v clang++
          command -v ld.lld
          command -v gcc
          command -v ld

          echo "===== TARGET TOOLS ====="
          "$GCC64/aarch64-linux-android-gcc" --version | head -n 2
          "$GCC64/aarch64-linux-android-ld" --version | head -n 2
          "$GCC32/arm-linux-androideabi-gcc" --version | head -n 2
          "$GCC32/arm-linux-androideabi-ld" --version | head -n 2

          echo "===== TARGET LINKER RESOLUTION ====="
          "$GCC64/aarch64-linux-android-gcc" -print-prog-name=ld
          test -x "$GCC64/aarch64-linux-android-ld"

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PYTHON=python2.7

          # IMPORTANT:
          # Use absolute cross-compiler prefixes so Android GCC tools
          # never replace the native host compiler/linker used by fixdep.
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          # Host tools must be native Ubuntu tools.
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTLD=ld.lld
          export HOSTAR=llvm-ar

          rm -rf out

          make O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            RMX1821_defconfig

          make O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            olddefconfig

          test -f out/.config

          echo "===== FINAL CONFIG CHECK ====="
          grep -E '^(CONFIG_CROSS_COMPILE|CONFIG_CROSS_COMPILE_ARM32|CONFIG_MACH_MT6771|CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|CONFIG_IMG_GZ_DTB)=' \
            out/.config || true

      - name: Compile kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PYTHON=python2.7

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTLD=ld.lld
          export HOSTAR=llvm-ar

          echo "===== FINAL TOOLCHAIN ====="
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTLD=$HOSTLD"

          make -j"$(nproc)" O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            PYTHON="$PYTHON" \
            2>&1 | tee build.log

      - name: Verify kernel output
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== KERNEL OUTPUT ====="
          find out/arch/arm64/boot -maxdepth 2 -type f \
            \( -name 'Image*' -o -name '*.dtb' -o -name '*.dtbo' \) \
            -printf '%p\n' | sort

          test -s out/arch/arm64/boot/Image

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Found Image.gz-dtb"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Found Image.gz"
          else
            echo "ERROR: no Image.gz-dtb or Image.gz was produced."
            exit 1
          fi

          dtb_count="$(find out/arch/arm64/boot/dts -type f -name '*.dtb' | wc -l)"
          echo "DTB count: $dtb_count"
          test "$dtb_count" -gt 0

      - name: Collect kernel and DTBs
        shell: bash
        run: |
          set -eux
          rm -rf kernel-output
          mkdir -p kernel-output/dtb

          for f in \
            Image Image.gz Image.gz-dtb Image-dtb \
            Image.lz4 Image.lzma Image.xz; do
            if [ -f "out/arch/arm64/boot/$f" ]; then
              cp "out/arch/arm64/boot/$f" kernel-output/
            fi
          done

          find out/arch/arm64/boot/dts \
            -type f -name '*.dtb' \
            -exec cp {} kernel-output/dtb/ \;

          cp out/.config kernel-output/kernel.config
          cp build.log kernel-output/build.log

          echo "===== ARTIFACT CONTENTS ====="
          find kernel-output -type f -printf '%p\n' | sort

      - name: Package kernel artifact
        run: |
          set -eux
          cd kernel-output
          zip -9 -r ../Realme3i-RMX1827-Kernel-Q.zip .
          cd ..
          ls -lh Realme3i-RMX1827-Kernel-Q.zip

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-RMX1827-Kernel-Q
          path: |
            Realme3i-RMX1827-Kernel-Q.zip
            kernel-output/build.log
            kernel-output/kernel.config
