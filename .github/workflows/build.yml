name: Build Realme 3i Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncurses-dev zip libgnutls28-dev python3 python-is-python3

      - name: Download GCC Toolchains (4.9)
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Apply RMX1821 defconfig
          make O=out RMX1821_defconfig

          # Compile kernel
          make -j$(nproc --all) O=out KCFLAGS="-Wno-error -w -fno-stack-protector -fcommon"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-Kernel-Image
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/mediatek/*.dtb
            
