name: RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Q branch
        uses: actions/checkout@v4
        with:
          ref: Q
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            libelf-dev \
            libgnutls28-dev \
            clang \
            lld \
            llvm \
            git \
            zip \
            unzip \
            cpio \
            rsync \
            python2.7 \
            python2.7-minimal

          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2

          echo "===== HOST TOOLS ====="
          gcc --version | head -n 1
          clang --version | head -n 1
          ld --version | head -n 1
          ld.lld --version | head -n 1
          python2.7 --version

      # ============================================================
      # SOURCE CHECK
      # ============================================================
      - name: Check kernel source
        shell: bash
        run: |
          set -euxo pipefail

          test -f Makefile
          test -f arch/arm64/configs/RMX1821_defconfig
          test -f tools/dct/DrvGen.py

          echo
          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile || true

          echo
          echo "========================================"
          echo "DEFCONFIG"
          echo "========================================"

          grep -E \
            '^(CONFIG_(CROSS_COMPILE|CROSS_COMPILE_ARM32|LOCALVERSION|MACH_MT6771|BUILD_ARM64_APPENDED_DTB_IMAGE|IMG_GZ_DTB))=' \
            arch/arm64/configs/RMX1821_defconfig || true

      # ============================================================
      # PHOENIX DEPENDENCY CHECK
      # IMPORTANT:
      # Do NOT create fake/empty phoenix.h
      # ============================================================
      - name: Inspect Phoenix dependency
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PHOENIX FILES PRESENT IN SOURCE"
          echo "========================================"

          find . \
            -path './.git' -prune -o \
            -iname '*phoenix*' \
            -print | sort || true

          echo
          echo "========================================"
          echo "PHOENIX HEADER REFERENCES"
          echo "========================================"

          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.so' \
            'oppo_phoenix\.h' \
            . || true

          echo
          echo "========================================"
          echo "CHECK REQUIRED HEADER"
          echo "========================================"

          if [ -f \
            "drivers/soc/oppo/oppo_phoenix/oppo_phoenix.h" ]; then

            echo "Phoenix header found:"
            ls -lh \
              drivers/soc/oppo/oppo_phoenix/oppo_phoenix.h

          elif [ -f \
            "include/linux/oppo_phoenix.h" ]; then

            echo "Phoenix header found:"
            ls -lh include/linux/oppo_phoenix.h

          elif [ -f \
            "vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/oppo_phoenix.h" ]; then

            echo "Phoenix vendor header found:"
            ls -lh \
              vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/oppo_phoenix.h

          else

            echo
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "PHOENIX DEPENDENCY IS MISSING"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo
            echo "kernel/panic.c requires:"
            echo
            echo "drivers/soc/oppo/oppo_phoenix/oppo_phoenix.h"
            echo
            echo "The source does NOT contain that header."
            echo
            echo "NO FAKE HEADER WILL BE CREATED."
            echo
            echo "This build is intentionally stopped because"
            echo "a fake Phoenix header can produce a kernel that"
            echo "compiles but is not equivalent to the stock kernel."
            echo
            exit 1
          fi

      # ============================================================
      # PREPARE PYTHON SCRIPT
      # ============================================================
      - name: Prepare source scripts
        shell: bash
        run: |
          set -euxo pipefail

          git config --global core.autocrlf false

          sed -i 's/\r$//' tools/dct/DrvGen.py

          chmod +x tools/dct/DrvGen.py

          python2.7 -m py_compile \
            tools/dct/DrvGen.py

      # ============================================================
      # ANDROID GCC 4.9
      # ============================================================
      - name: Download Android 10 GCC 4.9 toolchains
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf toolchains

          mkdir -p \
            toolchains/gcc64 \
            toolchains/gcc32

          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64

          git clone \
            --depth=1 \
            --branch android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchains/gcc32

          echo
          echo "========================================"
          echo "CHECK GCC 64"
          echo "========================================"

          test -x \
            toolchains/gcc64/bin/aarch64-linux-android-gcc

          test -x \
            toolchains/gcc64/bin/aarch64-linux-android-ld

          echo
          echo "========================================"
          echo "CHECK GCC 32"
          echo "========================================"

          test -x \
            toolchains/gcc32/bin/arm-linux-androideabi-gcc

          test -x \
            toolchains/gcc32/bin/arm-linux-androideabi-ld

      # ============================================================
      # COMPILER TEST
      # ============================================================
      - name: Verify host and target compilers
        shell: bash
        run: |
          set -euxo pipefail

          GCC64="$GITHUB_WORKSPACE/toolchains/gcc64/bin"
          GCC32="$GITHUB_WORKSPACE/toolchains/gcc32/bin"

          echo
          echo "========================================"
          echo "HOST COMPILER"
          echo "========================================"

          command -v gcc
          command -v clang
          command -v clang++
          command -v ld
          command -v ld.lld

          echo
          echo "========================================"
          echo "AARCH64 GCC"
          echo "========================================"

          "$GCC64/aarch64-linux-android-gcc" \
            --version | head -n 2

          echo
          echo "========================================"
          echo "ARM32 GCC"
          echo "========================================"

          "$GCC32/arm-linux-androideabi-gcc" \
            --version | head -n 2

          echo
          echo "========================================"
          echo "LINKER"
          echo "========================================"

          "$GCC64/aarch64-linux-android-gcc" \
            -print-prog-name=ld

          test -x \
            "$GCC64/aarch64-linux-android-ld"

          test -x \
            "$GCC32/arm-linux-androideabi-ld"

          echo
          echo "Compiler test: PASS"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PYTHON=python2.7

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          # HOST tools MUST remain native Ubuntu tools.
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTLD=ld.lld
          export HOSTAR=llvm-ar

          rm -rf out

          echo
          echo "========================================"
          echo "CONFIGURE KERNEL"
          echo "========================================"

          make O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            RMX1821_defconfig

          echo
          echo "========================================"
          echo "OLDDEFCONFIG"
          echo "========================================"

          make O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            olddefconfig

          test -f out/.config

          echo
          echo "========================================"
          echo "FINAL CONFIG"
          echo "========================================"

          grep -E \
            '^(CONFIG_CROSS_COMPILE|CONFIG_CROSS_COMPILE_ARM32|CONFIG_MACH_MT6771|CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|CONFIG_IMG_GZ_DTB)=' \
            out/.config || true

      # ============================================================
      # BUILD
      # ============================================================
      - name: Compile kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PYTHON=python2.7

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTLD=ld.lld
          export HOSTAR=llvm-ar

          echo
          echo "========================================"
          echo "BUILD SETTINGS"
          echo "========================================"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "HOSTCC=$HOSTCC"
          echo "HOSTLD=$HOSTLD"

          echo
          echo "========================================"
          echo "BUILD KERNEL"
          echo "========================================"

          make -j"$(nproc)" \
            O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            PYTHON="$PYTHON" \
            2>&1 | tee build.log

      # ============================================================
      # VERIFY KERNEL
      # ============================================================
      - name: Verify kernel output
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "========================================"
          echo "KERNEL OUTPUT"
          echo "========================================"

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \
              -name 'Image*' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
            \
            -printf '%p\n' | sort

          test -s \
            out/arch/arm64/boot/Image

          if [ -f \
            out/arch/arm64/boot/Image.gz-dtb ]; then

            echo "Found Image.gz-dtb"

          elif [ -f \
            out/arch/arm64/boot/Image.gz ]; then

            echo "Found Image.gz"

          else

            echo
            echo "ERROR: Kernel Image.gz/Image.gz-dtb missing."
            exit 1

          fi

          DTB_COUNT="$(
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtb' | wc -l
          )"

          echo "DTB count: $DTB_COUNT"

          test "$DTB_COUNT" -gt 0

      # ============================================================
      # COLLECT OUTPUT
      # ============================================================
      -
