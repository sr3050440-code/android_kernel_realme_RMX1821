name: Build Realme 3i RMX1827 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: RMX1827 Kernel Build
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: RMX1821_defconfig

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT Q SOURCE
      # ============================================================
      - name: Checkout Q Branch
        uses: actions/checkout@v4
        with:
          ref: Q
          fetch-depth: 1

      # ============================================================
      # 2. CHECK SOURCE
      # ============================================================
      - name: Validate Source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " REALME 3 / 3i KERNEL SOURCE"
          echo "========================================"

          test -f Makefile
          test -d arch/arm64
          test -f arch/arm64/configs/${DEFCONFIG}

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Defconfig:"
          echo "arch/arm64/configs/${DEFCONFIG}"

          echo
          echo "MT6771 DTS files:"
          find arch/arm64/boot/dts/mediatek \
            -type f \
            \( -name '*6771*.dts' -o -name '*6771*.dtsi' \) \
            | sort | head -100

      # ============================================================
      # 3. PHOENIX CHECK
      #
      # NEVER CREATE A FAKE PHOENIX HEADER.
      # ============================================================
      - name: Check Phoenix Dependency
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " PHOENIX CHECK"
          echo "========================================"

          REFS="$(grep -RIn \
            --exclude-dir=.git \
            -E 'oppo_phoenix|oppo_phoenix\.h|vendor/oppo/oppo_phoenix' \
            . 2>/dev/null || true)"

          if [ -n "$REFS" ]; then

            echo "Phoenix references found:"
            echo
            echo "$REFS"
            echo

            HEADER="$(find . \
              -path './.git' -prune -o \
              -type f \
              -name 'oppo_phoenix.h' \
              -print -quit)"

            if [ -z "$HEADER" ]; then
              echo
              echo "ERROR:"
              echo "Source references oppo_phoenix.h"
              echo "but the real header is missing."
              echo
              echo "Stopping instead of creating a fake header."
              exit 1
            fi

            echo "Real Phoenix header:"
            echo "$HEADER"

          else

            echo "No Phoenix dependency found."

          fi

      # ============================================================
      # 4. INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      # ============================================================
      # 5. PREPARE SOURCE
      # ============================================================
      - name: Prepare Source
        shell: bash
        run: |
          set -e

          git config --global core.autocrlf false

          if [ -f tools/dct/DrvGen.py ]; then
            sed -i 's/\r$//' tools/dct/DrvGen.py
            chmod +x tools/dct/DrvGen.py
          fi

          echo "Source preparation complete."

      # ============================================================
      # 6. DOWNLOAD ANDROID GCC 4.9
      #
      # Clone the actual Google prebuilts instead of extracting
      # a tarball whose directory layout may differ.
      # ============================================================
      - name: Setup Android GCC 4.9
        shell: bash
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/toolchains"

          rm -rf "$TOOLCHAIN"
          mkdir -p "$TOOLCHAIN"

          echo "========================================"
          echo " DOWNLOADING AARCH64 GCC 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            -b android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$TOOLCHAIN/gcc64"

          echo
          echo "========================================"
          echo " DOWNLOADING ARM32 GCC 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            -b android10-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            "$TOOLCHAIN/gcc32"

          echo
          echo "Checking AArch64 compiler..."

          test -x \
            "$TOOLCHAIN/gcc64/bin/aarch64-linux-android-gcc"

          echo "AArch64 compiler: FOUND"

          echo
          echo "Checking ARM32 compiler..."

          test -x \
            "$TOOLCHAIN/gcc32/bin/arm-linux-androideabi-gcc"

          echo "ARM32 compiler: FOUND"

          echo
          echo "AArch64 GCC:"
          "$TOOLCHAIN/gcc64/bin/aarch64-linux-android-gcc" \
            --version | head -1

          echo
          echo "ARM32 GCC:"
          "$TOOLCHAIN/gcc32/bin/arm-linux-androideabi-gcc" \
            --version | head -1

      # ============================================================
      # 7. SETUP COMPILER ENVIRONMENT
      # ============================================================
      - name: Setup Compiler Environment
        shell: bash
        run: |
          set -e

          TOOLCHAIN="$GITHUB_WORKSPACE/toolchains"

          echo "$TOOLCHAIN/gcc64/bin" >> "$GITHUB_PATH"
          echo "$TOOLCHAIN/gcc32/bin" >> "$GITHUB_PATH"

          echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"

      # ============================================================
      # 8. FINAL COMPILER TEST
      # ============================================================
      - name: Test Compiler
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " COMPILER TEST"
          echo "========================================"

          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc

          aarch64-linux-android-gcc --version | head -1
          arm-linux-androideabi-gcc --version | head -1

          echo
          echo "Compiler test: PASS"

      # ============================================================
      # 9. CONFIGURE USING EXISTING DEVICE DEFCONFIG
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -e

          rm -rf out
          mkdir -p out

          echo "========================================"
          echo " CONFIGURE KERNEL"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            "$DEFCONFIG"

          test -f out/.config

          echo
          echo "Running olddefconfig..."

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            olddefconfig

          test -f out/.config

          echo
          echo "Configuration complete."

      # ============================================================
      # 10. CONFIG SAFETY CHECK
      # ============================================================
      - name: Validate Configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " CONFIGURATION CHECK"
          echo "========================================"

          test -f out/.config

          echo
          echo "ARM64:"
          grep '^CONFIG_ARM64=' out/.config || true

          echo
          echo "MediaTek:"
          grep -E \
            'CONFIG_MTK|CONFIG_MEDIATEK|CONFIG_MACH_MT6771' \
            out/.config \
            | head -100 || true

          echo
          echo "DTB:"
          grep -E \
            'CONFIG_BUILD_ARM64|CONFIG_ARM64_APPENDED' \
            out/.config || true

      # ============================================================
      # 11. BUILD KERNEL
      # ============================================================
      - name: Compile Kernel
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo " REALME 3i RMX1827 KERNEL BUILD"
          echo "========================================"

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Compiler:"
          aarch64-linux-android-gcc --version | head -1

          echo
          echo "Build started:"
          date

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "========================================"
            echo " BUILD FAILED"
            echo "========================================"

            echo
            echo "===== IMPORTANT ERRORS ====="

            grep -Ei \
              'error:|fatal:|No such file|not found|undefined reference|Error [0-9]+' \
              build.log \
              | tail -100 || true

            echo
            echo "===== LAST 100 LINES ====="
            tail -100 build.log

            exit "$STATUS"
          fi

          echo
          echo "========================================"
          echo " BUILD SUCCESS"
          echo "========================================"

      # ============================================================
      # 12. BUILD DTBS
      # ============================================================
      - name: Build Device Trees
        shell: bash
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            dtbs

      # ============================================================
      # 13. VERIFY KERNEL OUTPUT
      # ============================================================
      - name: Verify Kernel Output
        shell: bash
        run: |
          set -e

          BOOT="out/arch/arm64/boot"

          echo "========================================"
          echo " KERNEL OUTPUT"
          echo "========================================"

          test -d "$BOOT"

          find "$BOOT" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Checking kernel image..."

          FOUND=0

          for IMAGE in \
            Image \
            Image.gz \
            Image.gz-dtb \
            Image-dtb
          do
            if [ -f "$BOOT/$IMAGE" ]; then
              echo "FOUND: $IMAGE"
              ls -lh "$BOOT/$IMAGE"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo
            echo "ERROR: Kernel image not produced."
            exit 1
          fi

      # ============================================================
      # 14. VERIFY MT6771 DTBS
      # ============================================================
      - name: Verify DTBs
        shell: bash
        run: |
          set -e

          DTB_DIR="out/arch/arm64/boot/dts/mediatek"

          test -d "$DTB_DIR"

          echo "========================================"
          echo " MT6771 DTB OUTPUT"
          echo "========================================"

          find "$DTB_DIR" \
            -type f \
            -name '*.dtb' \
            -printf '%f\n' \
            | sort

          COUNT="$(find "$DTB_DIR" -type f -name '*.dtb' | wc -l)"

          echo
          echo "DTB count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No DTB produced."
            exit 1
          fi

      # ============================================================
      # 15. COLLECT
      # ============================================================
      - name: Collect Build Output
        shell: bash
        run: |
          set -e

          rm -rf kernel-output

          mkdir -p kernel-output/dtb

          BOOT="out/arch/arm64/boot"

          for IMAGE in \
            Image \
            Image.gz \
            Image.gz-dtb \
            Image-dtb
          do
            if [ -f "$BOOT/$IMAGE" ]; then
              cp "$BOOT/$IMAGE" kernel-output/
            fi
          done

          if [ -d "$BOOT/dts/mediatek" ]; then
            find "$BOOT/dts/mediatek" \
              -type f \
              -name '*.dtb' \
              -exec cp {} kernel-output/dtb/ \;
          fi

          cp out/.config kernel-output/kernel.config
          cp build.log kernel-output/build.log

          echo
          echo "========================================"
          echo " ARTIFACT CONTENTS"
          echo "========================================"

          find kernel-output \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # 16. PACKAGE
      # ============================================================
      - name: Package Kernel
        shell: bash
        run: |
          set -e

          cd kernel-output

          zip -9 -r \
            ../Realme3i-RMX1827-kernel.zip \
            .

          cd ..

          ls -lh Realme3i-RMX1827-kernel.zip

      # ============================================================
      # 17. UPLOAD
      # ============================================================
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-RMX1827-kernel
          path: |
            Realme3i-RMX1827-kernel.zip
            kernel-output/build.log
            kernel-output/kernel.config
          if-no-files-found: error
