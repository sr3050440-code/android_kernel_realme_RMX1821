name: Build Realme 3i Kernel Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncurses-dev zip libgnutls28-dev clang lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python2.7
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
          chmod +x tools/dct/DrvGen.py
          python2 --version
          test -f tools/dct/DrvGen.py

      - name: Setup Cross Compilers
        run: |
          mkdir -p gcc64/bin gcc32/bin
          for x in /usr/bin/aarch64-linux-gnu-*; do ln -sf "$x" gcc64/bin/; done
          for x in /usr/bin/arm-linux-gnueabi-*; do ln -sf "$x" gcc32/bin/; done

      - name: Inject Missing Phoenix Headers
        run: |
          mkdir -p include/linux
          [ -f include/linux/phoenix.h ] || touch include/linux/phoenix.h
          [ -f include/linux/phoenix_kcompat.h ] || touch include/linux/phoenix_kcompat.h

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:/usr/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export PYTHON=python2.7
          make O=out RMX1821_defconfig
          make O=out olddefconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config 2>/dev/null || true
          make O=out olddefconfig
          make -j"$(nproc)" O=out CC=clang HOSTCC=clang PYTHON=python2.7 KCFI=0
          test -f out/arch/arm64/boot/Image

      - name: Package Kernel
        run: |
          mkdir -p AnyKernel3
          cp out/arch/arm64/boot/Image* AnyKernel3/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/mediatek/*.dtb AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          zip -r ../Realme3i-Kernel.zip ./*

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-Kernel
          path: Realme3i-Kernel.zip
